<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Board v4</title>
<style>
:root{--bg:#0e1117;--card:#181c25;--tx:#e8eaf0;--mu:#8b93a7;--up:#22c55e;--dn:#ef4444}
*{box-sizing:border-box}body{margin:auto;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:12px;max-width:640px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
select,button,input{font-size:16px;border-radius:10px;border:0;padding:12px}
select,input{background:#252b38;color:var(--tx);width:100%}
#btn{width:100%;background:#3b82f6;color:#fff;font-weight:700;font-size:20px;padding:18px;margin-top:10px}
#price{font-size:32px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.big{font-size:30px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}td{padding:4px 0;border-top:1px solid #252b38}
.warn{color:#f59e0b;font-size:13px;margin-top:6px}
.wl{width:48%;margin-top:8px;padding:10px;font-size:14px;background:#252b38;color:var(--tx)}
.sk{color:#f59e0b}.badge{display:inline-block;padding:3px 8px;border-radius:8px;background:#252b38;font-size:12px;margin:0 6px 4px 0}
.rs{font-size:12px;color:var(--mu);margin-top:6px}.row{display:flex;gap:8px;margin-top:8px}
</style></head><body>
<div class="card">
 <select id="pair"></select>
 <div style="margin-top:10px"><span id="price">--</span> <span id="st" class="mu"></span></div>
 <div class="mu">Next candle: <b id="cd">--</b>s</div>
 <div id="badges" style="margin-top:6px"></div>
 <div id="warn" class="warn"></div>
 <div class="row"><input id="off" type="number" step="any" placeholder="Olymp price − feed price (offset)"><button class="wl" id="key" style="width:auto">🔑 Key</button></div>
 <button id="btn">⚡ CREATE SIGNAL</button>
</div>
<div class="g"><div class="card" id="r1"><div class="mu">1 Min</div></div><div class="card" id="r2"><div class="mu">2 Min</div></div></div>
<div class="card"><b>📊 My Accuracy (auto)</b><div id="stats" class="mu"></div><button class="wl" id="rst">Reset</button></div>
<div class="card"><b>History</b><div id="hist" class="mu"></div></div>
<div class="mu" style="text-align:center">Use on demo only. No signal is 100% accurate.</div>
<script>
const PAIRS={'EUR/USD':'EUR/USD','GBP/USD':'GBP/USD','USD/JPY':'USD/JPY','AUD/USD':'AUD/USD','USD/CAD':'USD/CAD','EUR/GBP':'EUR/GBP','GBP/JPY':'GBP/JPY','Gold (XAU/USD)':'XAU/USD'};
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let hist=ld('h',[]),log=ld('log',[]),offs=ld('offs',{}),API_KEY=ld('k','');
$('pair').innerHTML=Object.keys(PAIRS).map(p=>`<option>${p}</option>`).join('');
const showOff=()=>$('off').value=offs[$('pair').value]??'';showOff();
$('pair').onchange=showOff;
$('off').onchange=()=>{offs[$('pair').value]=+$('off').value||0;sv('offs',offs)};
$('key').onclick=()=>{const k=prompt('Twelve Data API key:',API_KEY);if(k){API_KEY=k.trim();sv('k',API_KEY)}};
setInterval(()=>$('cd').textContent=60-new Date().getSeconds(),500);

const ema=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function rsi(cl,p=14){let g=0,l=0;for(let i=1;i<=p;i++){const d=cl[i]-cl[i-1];d>0?g+=d:l-=d}g/=p;l/=p;
 for(let i=p+1;i<cl.length;i++){const d=cl[i]-cl[i-1];g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p}
 return l===0?100:100-100/(1+g/l)}
function adx(c,p=14){const n=c.length;if(n<2*p+1)return null;const tr=[],pd=[],md=[];
 for(let i=1;i<n;i++){const u=c[i].h-c[i-1].h,d=c[i-1].l-c[i].l;
  tr.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));pd.push(u>d&&u>0?u:0);md.push(d>u&&d>0?d:0)}
 const sm=a=>a.slice(0,p).reduce((x,y)=>x+y);let T=sm(tr),P=sm(pd),M=sm(md);const dx=[];
 for(let i=p;i<=tr.length;i++){if(i>p){T=T-T/p+tr[i-1];P=P-P/p+pd[i-1];M=M-M/p+md[i-1]}
  const a=100*P/T,b=100*M/T;dx.push(100*Math.abs(a-b)/((a+b)||1))}
 let A=dx.slice(0,p).reduce((x,y)=>x+y)/p;for(let i=p;i<dx.length;i++)A=(A*(p-1)+dx[i])/p;return A}
function atr(c,p=14){const s=c.slice(-p-1);let t=0;for(let i=1;i<s.length;i++)t+=Math.max(s[i].h-s[i].l,Math.abs(s[i].h-s[i-1].c),Math.abs(s[i].l-s[i-1].c));return t/(s.length-1)}
const closed=c=>c.slice(0,-1); // drop the forming candle
function trend(c){const cl=c.map(x=>x.c);if(cl.length<30)return 0;return ema(cl,9).at(-1)>ema(cl,21).at(-1)?1:-1}
function agg2(c){const m={};c.forEach(x=>{const k=Math.floor(x.t/120000);
 if(!m[k])m[k]={t:k*120000,o:x.o,h:x.h,l:x.l,c:x.c,n:1};else{m[k].h=Math.max(m[k].h,x.h);m[k].l=Math.min(m[k].l,x.l);m[k].c=x.c;m[k].n++}});
 return Object.values(m).filter(x=>x.n===2)}
function analyze(c){
 const cl=c.map(x=>x.c);if(cl.length<40)return null;const rows=[];
 const e9=ema(cl,9).at(-1),e21=ema(cl,21).at(-1);
 rows.push(['EMA 9/21',e9>e21?1:-1,e9>e21?'9 above 21':'9 below 21']);
 const r=rsi(cl);rows.push(['RSI 14',r<30?1:r>70?-1:r>52?0.5:r<48?-0.5:0,r.toFixed(1)]);
 const e12=ema(cl,12),e26=ema(cl,26),m=e12.map((v,i)=>v-e26[i]),sg=ema(m,9),h=m.at(-1)-sg.at(-1);
 rows.push(['MACD',h>0?1:-1,h.toFixed(5)]);
 const w=cl.slice(-20),mean=w.reduce((a,b)=>a+b)/20,sd=Math.sqrt(w.reduce((a,b)=>a+(b-mean)**2,0)/20),p=cl.at(-1);
 rows.push(['Bollinger',p<mean-2*sd?1:p>mean+2*sd?-1:p>mean?0.3:-0.3,p>mean?'above mid':'below mid']);
 const s=c.slice(-14),hi=Math.max(...s.map(x=>x.h)),lo=Math.min(...s.map(x=>x.l)),k=(p-lo)/(hi-lo||1)*100;
 rows.push(['Stoch 14',k<20?1:k>80?-1:0,k.toFixed(0)]);
 const l3=c.slice(-3),mom=l3.every(x=>x.c>x.o)?1:l3.every(x=>x.c<x.o)?-1:0;
 rows.push(['Last 3 candles',mom,mom>0?'3 green':mom<0?'3 red':'mixed']);
 const sc=rows.reduce((a,x)=>a+x[1],0),conf=Math.min(100,Math.round(Math.abs(sc)/rows.length*130));
 return{rows,dir:sc>0.5?'UP':sc<-0.5?'DOWN':'NEUTRAL',conf,p}}
function decide(a,F,c){
 if(!a)return null;const d=a.dir==='UP'?1:-1,why=[];
 if(a.dir==='NEUTRAL')why.push('no clear signal');
 else{if(F.t5!==d)why.push('5m trend opposite');if(F.t15!==d)why.push('15m trend opposite');
  if(F.adx!==null&&F.adx<20)why.push('market sideways');if(a.conf<70)why.push('low confidence');
  const A=atr(c),z=c.slice(-31,-1),hi=Math.max(...z.map(x=>x.h)),lo=Math.min(...z.map(x=>x.l));
  if(d===1&&hi-a.p<0.5*A)why.push('near resistance');
  if(d===-1&&a.p-lo<0.5*A)why.push('near support');
  const lc=c.at(-1);if(Math.abs(lc.c-lc.o)>2.5*A)why.push('spike candle (better to wait)')}
 return{...a,why,verdict:why.length?'SKIP':a.dir}}
function card(id,label,a,ts,key,off){
 const el=$(id);if(!a){el.innerHTML=`<div class="mu">${label}</div>Not enough data`;return}
 const skip=a.verdict==='SKIP',cls=skip?'sk':a.dir==='UP'?'up':'dn',ar=skip?'⛔':a.dir==='UP'?'▲':'▼';
 el.innerHTML=`<div class="mu">${label}</div><div class="big ${cls}">${ar} ${a.verdict}</div>
 <div>Confidence: <b>${a.conf}%</b> ${skip?'<span class="mu">('+a.dir+')</span>':''}</div>
 ${skip?`<div class="rs">Why skip: ${a.why.join(', ')}</div>`:`<div class="mu">Entry: ${(a.p+off).toFixed(5)} • ${ts}</div><div class="mu">Enter at next candle open</div><div id="b_${key}" class="mu">⏳ Result will be auto-checked</div>`}
 <table>${a.rows.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]>0?'up':r[1]<0?'dn':'mu'}">${r[1]>0?'▲':r[1]<0?'▼':'•'}</td><td class="mu">${r[2]}</td></tr>`).join('')}</table>`}
function addLog(pair,tf,dir,conf,r){log.unshift({pair,tf,dir,conf,r});log=log.slice(0,500);sv('log',log);renderS()}
function track(key,pair,sym,a,mins,entry){
 setTimeout(async()=>{const el=$('b_'+key);
  try{const x=(await get(sym,'1min',3)).at(-1).c;
   if(x===entry){if(el)el.textContent='➖ Tie (not recorded)';return}
   const win=a.dir==='UP'?x>entry:x<entry;addLog(pair,key,a.dir,a.conf,win?1:0);
   if(el)el.innerHTML=win?'<b class="up">✅ Won</b>':'<b class="dn">❌ Lost</b>'}
  catch(e){if(el)el.textContent='⚠️ Result check failed'}},mins*60000+3000)}
function renderS(){const t=log.length;if(!t){$('stats').innerHTML='<br>No trades recorded yet. Results save automatically.';return}
 const w=log.filter(x=>x.r).length,by={};log.forEach(x=>{by[x.pair]=by[x.pair]||[0,0];by[x.pair][1]++;if(x.r)by[x.pair][0]++});
 const pc=(a,b)=>Math.round(a/b*100)+'%',hi=log.filter(x=>x.conf>=80);
 $('stats').innerHTML=`<br>Total: <b>${t}</b> • Won: <b class="up">${w}</b> • Lost: <b class="dn">${t-w}</b><br>Accuracy: <b>${pc(w,t)}</b> ${t<100?'(not reliable until 100 trades)':''}<br>${hi.length?'80%+ confidence: '+pc(hi.filter(x=>x.r).length,hi.length)+' ('+hi.length+' trades)<br>':''}${Object.entries(by).map(([k,v])=>k+': '+pc(v[0],v[1])+' ('+v[1]+')').join('<br>')}`}
$('rst').onclick=()=>{if(confirm('Delete all records?')){log=[];sv('log',log);renderS()}};
const renderH=()=>$('hist').innerHTML=hist.join('<br>')||'—';renderH();renderS();

async function get(sym,int,n){
 const j=await(await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${int}&outputsize=${n}&apikey=${API_KEY}`)).json();
 if(j.status==='error'||!j.values)throw new Error(j.message||'no data found');
 return j.values.reverse().map(v=>({t:new Date(v.datetime.replace(' ','T')+'Z').getTime(),o:+v.open,h:+v.high,l:+v.low,c:+v.close}))}
const cache={};
async function getC(sym,int,n,ttl){const k=sym+int,c=cache[k];if(c&&Date.now()-c.t<ttl)return c.d;const d=await get(sym,int,n);cache[k]={t:Date.now(),d};return d}
function cool(s){const b=$('btn');b.disabled=true;const iv=setInterval(()=>{if(--s<=0){clearInterval(iv);b.disabled=false;b.textContent='⚡ CREATE SIGNAL'}else b.textContent='⏳ '+s+'s wait'},1000);b.textContent='⏳ '+s+'s wait'}
$('btn').onclick=async()=>{
 if(!API_KEY){$('key').click();if(!API_KEY)return}
 const name=$('pair').value,sym=PAIRS[name],off=+(offs[name]||0);
 $('btn').disabled=true;$('st').textContent='⏳ fetching data…';$('warn').textContent='';
 try{
  const [r1,r5,r15]=await Promise.all([get(sym,'1min',120),getC(sym,'5min',60,240000),getC(sym,'15min',60,840000)]);
  const live=r1.at(-1).c,age=(Date.now()-r1.at(-1).t)/60000;
  if(age>5)$('warn').textContent=`⚠️ Market looks closed (last candle ${Math.round(age)} min old). Do not trade.`;
  const c1=closed(r1,60000),c5=closed(r5,300000),c15=closed(r15,900000);
  const F={t5:trend(c5),t15:trend(c15),adx:adx(c1)};
  const now=new Date(),ist=((now.getUTCHours()*60+now.getUTCMinutes()+330)%1440)/60,good=ist>=13.5&&ist<23;
  $('badges').innerHTML=`<span class="badge">5m ${F.t5>0?'▲':'▼'}</span><span class="badge">15m ${F.t15>0?'▲':'▼'}</span><span class="badge">ADX ${F.adx===null?'-':F.adx.toFixed(0)}</span><span class="badge">${good?'🟢 Good session':'🟠 Low volume time'}</span>`;
  const ts=now.toLocaleTimeString(),c2=agg2(c1),a1=decide(analyze(c1),F,c1),a2=c2.length>=40?decide(analyze(c2),F,c2):null;
  $('price').textContent=(live+off).toFixed(5);$('st').textContent='🟢 '+ts;
  card('r1','1 Min',a1,ts,'1m',off);card('r2','2 Min',a2,ts,'2m',off);
  if(a1&&a1.verdict!=='SKIP')track('1m',name,sym,a1,1,live);
  if(a2&&a2.verdict!=='SKIP')track('2m',name,sym,a2,2,live);
  if(a1){hist.unshift(`${ts} ${name} 1m:${a1.verdict}(${a1.conf}%) 2m:${a2?a2.verdict+'('+a2.conf+'%)':'-'}`);hist=hist.slice(0,15);sv('h',hist);renderH()}
  if(navigator.vibrate)navigator.vibrate(60);
 }catch(e){$('st').textContent='🔴';const m=e.message;$('warn').textContent=/minute/i.test(m)?'Per-minute limit reached. Wait 60 seconds.':/day|daily/i.test(m)?'Daily limit reached. Try tomorrow.':'Error: '+m;cool(/minute/i.test(m)?60:5);return}
 cool(8)};
</script></body></html>
